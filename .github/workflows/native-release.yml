name: Native Android release

# Every push to main that changes the native app publishes the next version (1.2.<run>), so the in-app updater
# always finds it; a native-vX.Y.Z tag still publishes exactly that version.
on:
  push:
    branches: [main]
    paths: ['android-native/**', '.github/workflows/native-release.yml']
    tags: ['native-v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: native-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-37.0' 'build-tools;37.0.0'
      - name: Prepare signing and version
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64" || { echo 'Configure Android signing secrets before releasing.'; exit 1; }
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/native-release.jks"
          echo "CAPYNIME_KEYSTORE=$RUNNER_TEMP/native-release.jks" >> "$GITHUB_ENV"
          if [[ "$GITHUB_REF" == refs/tags/native-v* ]]; then
            version="${GITHUB_REF_NAME#native-v}"
            [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Use native-vMAJOR.MINOR.PATCH tags.'; exit 1; }
          else
            version="1.2.$GITHUB_RUN_NUMBER" # ponytail: bump the 1.2 here when a big release deserves a new minor
          fi
          echo "NATIVE_TAG=native-v$version" >> "$GITHUB_ENV"
          echo "ORG_GRADLE_PROJECT_nativeVersionName=$version" >> "$GITHUB_ENV"
          echo "ORG_GRADLE_PROJECT_nativeVersionCode=$((1000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
      - name: Verify and build signed APK
        env:
          CAPYNIME_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          CAPYNIME_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          CAPYNIME_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x android-native/gradlew
          node android-native/build.mjs verify
          cd android-native/artifacts
          sha256sum Capynime-native-release.apk > Capynime-native-release.apk.sha256
      - name: Publish native release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$NATIVE_TAG" \
            android-native/artifacts/Capynime-native-release.apk \
            android-native/artifacts/Capynime-native-release.apk.sha256 \
            --target "$GITHUB_SHA" --title "Capynime Native ${NATIVE_TAG#native-v}" --generate-notes
